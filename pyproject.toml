[project]
name = "password-vault-sync"
version = "1.1.1"
description = "Syncs F3 Nation API orgs/users with a Vaultwarden instance as a GCP Cloud Run Job"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography==50.0.2",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/password_vault_sync"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
ignore = [
    "C901", # too complex
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = ["password_vault_sync", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
